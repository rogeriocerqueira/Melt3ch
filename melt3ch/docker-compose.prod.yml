version: "3.9"

services:

  db:
    image: postgres:16-alpine
    container_name: melt3ch_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-melt3ch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-melt3ch_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-melt3ch}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: melt3ch_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-melt3ch}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-melt3ch_db}
      SECRET_KEY: ${SECRET_KEY}
      ENVIRONMENT: production
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: melt3ch_frontend
    restart: always
    depends_on:
      - backend

  simulator:
    build: ./simulator
    container_name: melt3ch_simulator
    restart: always
    environment:
      API_URL: http://backend:8000
      INTERVAL_SECONDS: ${SIMULATOR_INTERVAL:-30}
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: melt3ch_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
