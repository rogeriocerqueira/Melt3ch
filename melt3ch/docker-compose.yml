version: "3.9"

services:

  # ── PostgreSQL ──────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: melt3ch_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: melt3ch
      POSTGRES_PASSWORD: melt3ch_secret
      POSTGRES_DB: melt3ch_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U melt3ch -d melt3ch_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend FastAPI ─────────────────────────────────
  backend:
    build: ./backend
    container_name: melt3ch_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://melt3ch:melt3ch_secret@db:5432/melt3ch_db
      SECRET_KEY: melt3ch_jwt_secret_change_in_production
      ENVIRONMENT: development
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ── Frontend Vue.js ─────────────────────────────────
  frontend:
    build: ./frontend
    container_name: melt3ch_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

  # ── Simulator IoT ───────────────────────────────────
  simulator:
    build: ./simulator
    container_name: melt3ch_simulator
    restart: unless-stopped
    environment:
      API_URL: http://backend:8000
      INTERVAL_SECONDS: 30
    depends_on:
      - backend

  # ── Nginx (produção) ────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: melt3ch_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend
    profiles:
      - production

volumes:
  postgres_data:
